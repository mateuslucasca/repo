name: Otamatone64 native ARM64

on:
  push:
    branches: [ "chatgpt/otamatone64-port" ]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ios-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
      - name: Build native Otamatone64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p otamatone64/build
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc -fblocks -O2 -g0 \
            -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations \
            otamatone64/src/*.m otamatone64/src/*.c \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AVFoundation \
            -framework CoreMotion \
            -framework WebKit \
            -framework QuartzCore \
            -o otamatone64/build/Otamatone64
          codesign --force --sign - --timestamp=none otamatone64/build/Otamatone64
      - name: Verify Mach-O
        shell: bash
        run: |
          set -euxo pipefail
          file otamatone64/build/Otamatone64
          lipo -info otamatone64/build/Otamatone64
          otool -l otamatone64/build/Otamatone64 | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true
          otool -L otamatone64/build/Otamatone64
          codesign -dvvv otamatone64/build/Otamatone64 2>&1 || true
          shasum -a 256 otamatone64/build/Otamatone64 | tee otamatone64/build/SHA256.txt
      - name: Add source snapshot
        run: |
          cp -R otamatone64/src otamatone64/build/source
          printf '%s\n' 'Native ARM64 reconstruction of Otamatone 1.21.' 'Original assets are intentionally not included in this public CI artifact.' > otamatone64/build/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Otamatone64-native-arm64
          path: otamatone64/build/
