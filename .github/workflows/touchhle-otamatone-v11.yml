name: touchHLE Otamatone v11 comprehensive compatibility

on:
  push:
    branches: [ "chatgpt/touchhle-otamatone-build" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-win:
    runs-on: windows-2022
    steps:
      - name: Checkout patch helper
        uses: actions/checkout@v4

      - name: Clone touchHLE
        shell: bash
        run: |
          git clone https://github.com/touchHLE/touchHLE touchhle
          cd touchhle
          git checkout 331903de883405a8597036e4ed5ce8333f1604c9
          git submodule update --init

      - name: Apply Otamatone v11 comprehensive compatibility
        shell: pwsh
        run: |
          python tools/apply_touchhle_otamatone_v11_release2.py touchhle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd touchhle
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v3
        with:
          path: touchhle\vendor\boost
          key: touchhle-boost_1_81_0

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        shell: pwsh
        run: |
          cd touchhle
          curl.exe -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        shell: cmd
        run: |
          cd touchhle
          7z -ovendor x boost_1_81_0.7z
          ren vendor\boost_1_81_0 boost

      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@v3
        with:
          path: touchhle\vendor\cmake
          key: touchhle-cmake_3_31_6_windows

      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Download CMake
        shell: pwsh
        run: |
          cd touchhle
          curl.exe -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"

      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Extract CMake
        shell: cmd
        run: |
          cd touchhle
          7z -ovendor x cmake-3.31.6-windows-x86_64.zip
          ren vendor\cmake-3.31.6-windows-x86_64 cmake

      - name: Build patched touchHLE
        shell: pwsh
        run: |
          cd touchhle
          cargo build --release
        env:
          CMAKE: ${{ github.workspace }}\touchhle\vendor\cmake\bin\cmake

      - name: Create Windows bundle
        shell: bash
        run: |
          cd touchhle/dev-scripts
          ./make-windows-bundle.sh ../target/release/touchHLE.exe
          mv touchHLE_windows_bundle/ ../../touchHLE_windows_bundle/

      - name: Add launcher and notes
        shell: bash
        run: |
          cat > touchHLE_windows_bundle/RUN_OTAMATONE_V11.bat <<'EOF'
          @echo off
          set RUST_BACKTRACE=1
          touchHLE.exe "touchHLE_apps\Otamatone-v1.21-(Clutch-1.3).ipa"
          pause
          EOF
          cat > touchHLE_windows_bundle/OTAMATONE_V11.txt <<'EOF'
          Otamatone v11 comprehensive compatibility build.
          Based on exact touchHLE commit 331903de883405a8597036e4ed5ce8333f1604c9.
          Keeps v1-v10 startup fixes, then adds a broad legacy UIKit/CoreAnimation pass:
          UIView NIB state, real masksToBounds clipping, responder-chain nil targets and
          IBFirstResponder routing, UIFont/UILabel NIB state, UIButton normal/highlight
          image states, functional UISegmentedControl, real UISlider NIB values + basic
          rendering/tracking, UIScrollView drag callbacks/flags, UITextField return action,
          functional legacy nav/tab controls, local-HTML UIWebView fallback, and
          interpolated implicit CGAffineTransform animations.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: touchHLE_Windows_x86_64_Otamatone_v11
          path: touchHLE_windows_bundle/
