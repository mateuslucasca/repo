name: CoverFlow16 rootless build

on:
  push:
    branches:
      - coverflow16-build
    paths:
      - 'coverflow16-src/**'
      - '.github/workflows/coverflow16-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless deb
        run: |
          export THEOS="$HOME/theos"
          make -C coverflow16-src clean package FINALPACKAGE=1
          find coverflow16-src/packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CoverFlow16-rootless
          path: coverflow16-src/packages/*.deb
          if-no-files-found: error
