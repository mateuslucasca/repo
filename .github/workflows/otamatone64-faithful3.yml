name: Otamatone64 faithful native ARM64 v3

on:
  push:
    branches: [ "chatgpt/otamatone64-faithful3" ]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ios-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact faithful source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          parts=(
            faithful-src/part00.b64
            faithful-src/part01.b64
            faithful-src/part02a.b64
            faithful-src/part02b.b64
            faithful-src/part02c.b64
            faithful-src/part02d.b64
            faithful-src/part03.b64
            faithful-src/part04a.b64
            faithful-src/part04b.b64
            faithful-src/part04c.b64
            faithful-src/part04d.b64
            faithful-src/part05.b64
          )
          cat "${parts[@]}" > /tmp/faithful-src.b64
          echo '60bf0421dbb8c5ebdf286d968c9ed53a2afec249a274c664459766052bb36115  /tmp/faithful-src.b64' | shasum -a 256 -c -
          base64 -D -i /tmp/faithful-src.b64 -o /tmp/faithful-src.tar.gz
          echo '0cb368a51281429989e49f77551e384dca0f1b9676e367effe477cf99d2ed362  /tmp/faithful-src.tar.gz' | shasum -a 256 -c -
          rm -rf otamatone64/src
          mkdir -p otamatone64/src
          tar -xzf /tmp/faithful-src.tar.gz -C otamatone64/src
          test "$(find otamatone64/src -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 10
          grep -Fq 'UIApplicationMain(argc,argv,nil,nil)' otamatone64/src/main.m
          ! grep -Fq 'UIAlertController' otamatone64/src/EAGLView.m
          grep -Fq 'NSClassFromString(@"UIMenuView")' otamatone64/src/LegacyViews.m

      - name: Apply original ARMv7 switch and melody-list reconstruction
        shell: bash
        run: |
          set -euxo pipefail
          cat faithful-patches/controls_part00.b64 faithful-patches/controls_part01.b64 faithful-patches/controls_part02.b64 faithful-patches/controls_part03.b64 > /tmp/original-controls.b64
          echo '7279652ffb209103dc1c3ecebf0249e3f29623805ad55a8c7c3dcf9c4b23ffff  /tmp/original-controls.b64' | shasum -a 256 -c -
          base64 -D -i /tmp/original-controls.b64 -o /tmp/original-controls.tar.gz
          echo '6662ef76b89af7ce7c10d95693e89e074f883453742150c7a60594984a3209bc  /tmp/original-controls.tar.gz' | shasum -a 256 -c -
          tar -xzf /tmp/original-controls.tar.gz -C otamatone64/src
          python3 - <<'PY'
          from pathlib import Path
          p=Path('otamatone64/src/LegacyViews.m')
          s=p.read_text()
          s=s.replace('@implementation UICustomSwitch\n', '@implementation UICustomSwitch\n@synthesize on=_on;\n', 1)
          old='''-(BOOL)endTrackingWithTouch:(UITouch*)touch withEvent:(UIEvent*)event{\n    BOOL r=[super endTrackingWithTouch:touch withEvent:event];\n    self.touchedSelf=YES;\n    [self setOn:_on animated:YES];\n    return r;\n}'''
          new='''-(void)endTrackingWithTouch:(UITouch*)touch withEvent:(UIEvent*)event{\n    [super endTrackingWithTouch:touch withEvent:event];\n    self.touchedSelf=YES;\n    [self setOn:_on animated:YES];\n}'''
          if old not in s:
              raise SystemExit('old endTracking implementation not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -Fq '@synthesize on=_on;' otamatone64/src/LegacyViews.m
          grep -Fq 'CGRectMake(4,2,87,23)' otamatone64/src/LegacyViews.m
          grep -Fq 'CGRectMake(78,207,91,27)' otamatone64/src/LegacyViews.m
          grep -Fq 'CGRectMake(78,365,91,27)' otamatone64/src/LegacyViews.m
          grep -Fq 'Chorus frog' otamatone64/src/LegacyViews.m
          grep -Fq 'merody_listbg_select.png' otamatone64/src/LegacyViews.m

      - name: Build faithful native Otamatone64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p otamatone64/build
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc -fblocks -O2 -g0 \
            -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations \
            otamatone64/src/*.m otamatone64/src/*.c \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AVFoundation \
            -framework CoreMotion \
            -framework WebKit \
            -framework QuartzCore \
            -o otamatone64/build/Otamatone64
          codesign --force --sign - --timestamp=none otamatone64/build/Otamatone64

      - name: Verify Mach-O and legacy UI hooks
        shell: bash
        run: |
          set -euxo pipefail
          file otamatone64/build/Otamatone64 | tee otamatone64/build/file.txt
          lipo -info otamatone64/build/Otamatone64 | tee otamatone64/build/lipo.txt
          otool -l otamatone64/build/Otamatone64 | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' > otamatone64/build/platform.txt || true
          otool -L otamatone64/build/Otamatone64 > otamatone64/build/dylibs.txt
          strings otamatone64/build/Otamatone64 | grep -E 'GameProjectAppDelegate|EAGLView|UINameEntryView|UIHtmlView|AlertView|SettingView|UISettingView|UIMelodyListView|UIMelodyListCellView|UISimpleHtml|UICustomSwitch|OpenMenu|OpenHowTo|OpenAbout|VolumeChanged|OctaveChanged|Chorus frog|Auld Lang Syne' | sort -u > otamatone64/build/legacy-hooks.txt
          grep -q 'Mach-O 64-bit executable arm64' otamatone64/build/file.txt
          grep -q 'architecture: arm64' otamatone64/build/lipo.txt
          shasum -a 256 otamatone64/build/Otamatone64 | tee otamatone64/build/SHA256.txt

      - name: Add faithful source snapshot
        shell: bash
        run: |
          cp -R otamatone64/src otamatone64/build/source
          printf '%s\n' \
            'ARM64 native reconstruction using the original MainWindow.nib hierarchy as the UI source of truth.' \
            'UICustomSwitch and Melody List behavior are reconstructed from the original ARMv7 implementation.' \
            'The proprietary original NIB/assets are intentionally not included in this public CI artifact.' \
            'Gameplay renderer translation is still being audited against the original ARMv7 SCTRL/Act1Renderer code.' \
            > otamatone64/build/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Otamatone64-faithful-controls-arm64
          path: otamatone64/build/
