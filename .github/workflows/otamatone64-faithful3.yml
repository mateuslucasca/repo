name: Otamatone64 faithful native ARM64 v3

on:
  push:
    branches: [ "chatgpt/otamatone64-faithful3" ]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ios-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact faithful source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          wc -c faithful-src/part*.b64
          shasum -a 256 faithful-src/part*.b64
          echo '65853fc23be0a32eb63bdf81370530d27f3b0944b7735b2139372d2fd1b47557  faithful-src/part00.b64' | shasum -a 256 -c -
          echo '5f26c2b231e9ebdbf2dbe89c520f0033fc7edd5f886f15936c33c84913f475d2  faithful-src/part01.b64' | shasum -a 256 -c -
          echo '616877cfd6c8a3e6577a94bc71bcf550f7afda95efd7e080326000d40e2b74e2  faithful-src/part02.b64' | shasum -a 256 -c -
          echo '8c07e801e38c08db4c2cd9dd1a4db85cea58790627d1f19f82e1cc78e2661618  faithful-src/part03.b64' | shasum -a 256 -c -
          echo '90220c50644a934be08b75e445740a44869d9a884bfbb80c389daf7c340340b2  faithful-src/part04.b64' | shasum -a 256 -c -
          echo 'dc9408290e7aa0afc213c6533ac115317707ac9bb00f65a350a3d1607cb199ac  faithful-src/part05.b64' | shasum -a 256 -c -
          cat faithful-src/part*.b64 > /tmp/faithful-src.b64
          echo '60bf0421dbb8c5ebdf286d968c9ed53a2afec249a274c664459766052bb36115  /tmp/faithful-src.b64' | shasum -a 256 -c -
          base64 --decode /tmp/faithful-src.b64 > /tmp/faithful-src.tar.gz
          echo '0cb368a51281429989e49f77551e384dca0f1b9676e367effe477cf99d2ed362  /tmp/faithful-src.tar.gz' | shasum -a 256 -c -
          rm -rf otamatone64/src
          mkdir -p otamatone64/src
          tar -xzf /tmp/faithful-src.tar.gz -C otamatone64/src
          test "$(find otamatone64/src -maxdepth 1 -type f | wc -l | tr -d ' ')" -ge 10
          grep -Fq 'UIApplicationMain(argc,argv,nil,nil)' otamatone64/src/main.m
          ! grep -Fq 'UIAlertController' otamatone64/src/EAGLView.m
          grep -Fq 'NSClassFromString(@"UIMenuView")' otamatone64/src/LegacyViews.m

      - name: Build faithful native Otamatone64
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p otamatone64/build
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc -fblocks -O2 -g0 \
            -Wall -Wextra -Wno-unused-parameter -Wno-deprecated-declarations \
            otamatone64/src/*.m otamatone64/src/*.c \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework AVFoundation \
            -framework CoreMotion \
            -framework WebKit \
            -framework QuartzCore \
            -o otamatone64/build/Otamatone64
          codesign --force --sign - --timestamp=none otamatone64/build/Otamatone64

      - name: Verify Mach-O and legacy UI hooks
        shell: bash
        run: |
          set -euxo pipefail
          file otamatone64/build/Otamatone64 | tee otamatone64/build/file.txt
          lipo -info otamatone64/build/Otamatone64 | tee otamatone64/build/lipo.txt
          otool -l otamatone64/build/Otamatone64 | grep -A8 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' > otamatone64/build/platform.txt || true
          otool -L otamatone64/build/Otamatone64 > otamatone64/build/dylibs.txt
          strings otamatone64/build/Otamatone64 | grep -E 'GameProjectAppDelegate|EAGLView|UINameEntryView|UIHtmlView|AlertView|SettingView|UISettingView|UIMelodyListView|UIMelodyListCellView|UISimpleHtml|UICustomSwitch|OpenMenu|OpenHowTo|OpenAbout|VolumeChanged|OctaveChanged' | sort -u > otamatone64/build/legacy-hooks.txt
          grep -q 'Mach-O 64-bit executable arm64' otamatone64/build/file.txt
          grep -q 'architecture: arm64' otamatone64/build/lipo.txt
          shasum -a 256 otamatone64/build/Otamatone64 | tee otamatone64/build/SHA256.txt

      - name: Add faithful source snapshot
        shell: bash
        run: |
          cp -R otamatone64/src otamatone64/build/source
          printf '%s\n' \
            'ARM64 native reconstruction using the original MainWindow.nib hierarchy as the UI source of truth.' \
            'The proprietary original NIB/assets are intentionally not included in this public CI artifact.' \
            'Gameplay renderer translation is still being audited against the original ARMv7 SCTRL/Act1Renderer code.' \
            > otamatone64/build/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Otamatone64-faithful-v3-arm64
          path: otamatone64/build/
